[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ksync"
dynamic = ["version"]
description = "Kindle highlights and notes fetched from Amazon's Kindle services, stored in SQLite"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{name = "Pol Alvarez", email = "pol@answer.ai"}]
dependencies = ["fastcore>=1.8", "fastlite", "kfxlib", "httpx", "cryptography"]

[project.entry-points.pyskills]
"ksync.skill" = "ksync.skill"

[project.urls]
Homepage = "https://github.com/kafkasl/ksync"

[tool.setuptools.dynamic]
version = {attr = "ksync.__version__"}

[tool.setuptools.packages.find]
include = ["ksync"]

[tool.uv.sources]
kfxlib = { path = "vendor/kfxlib", editable = true }
